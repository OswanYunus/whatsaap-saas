# Tukonnect Digital – Nginx Configuration
# Supports BOTH domains during DNS migration:
#   cerebro.tukonectdigital.co.ke (current)
#   wa.tukonectdigital.co.ke (new)
# 
# After you add the A record for wa.tukonectdigital.co.ke in HostPinnacle cPanel:
#   certbot --nginx -d wa.tukonectdigital.co.ke
#
# Install:
#   sudo cp deploy/hostpinacle/nginx-api.conf /etc/nginx/sites-available/waas-api
#   sudo ln -sf /etc/nginx/sites-available/waas-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name cerebro.tukonectdigital.co.ke wa.tukonectdigital.co.ke _;

    # Serve static frontend files
    root /opt/whatsapp-saas/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and health requests to backend
    location ~ ^/(api|health) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
